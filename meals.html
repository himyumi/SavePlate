<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SavePlate – Meal Planning</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .meal-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 20px;
        align-items: start;
      }

      /* ── CALENDAR ── */
      .cal-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .cal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 12px;
      }
      .cal-month { font-size: 18px; font-weight: 700; color: var(--text); }
      .cal-nav   { display: flex; align-items: center; gap: 6px; }
      .cal-nav-btn {
        background: none; border: 1px solid var(--border); border-radius: 6px;
        width: 28px; height: 28px; cursor: pointer; font-size: 13px;
        display: flex; align-items: center; justify-content: center;
        color: var(--text-muted); transition: .15s;
      }
      .cal-nav-btn:hover { background: #f0f0f0; color: var(--text); }
      .cal-nav-year { font-size: 12px; color: var(--text-muted); font-weight: 500; padding: 0 4px; }

      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        border-top: 1px solid var(--border);
      }
      .cal-day-name {
        text-align: center; font-size: 11px; font-weight: 700;
        color: var(--text-muted); text-transform: uppercase;
        padding: 8px 0 6px; border-bottom: 1px solid var(--border);
      }
      .cal-cell {
        display: flex; flex-direction: column; align-items: center;
        justify-content: flex-start; padding: 6px 4px 4px;
        border-right: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0;
        cursor: pointer; transition: background .12s; min-height: 52px; position: relative;
      }
      .cal-cell:hover { background: #f7f7f7; }
      .cal-cell.other-month .cal-num { color: #ccc; }
      .cal-cell.today .cal-num {
        background: var(--green-btn); color: #fff; border-radius: 50%;
        width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      }
      .cal-cell.selected { background: #eef4ff; }
      .cal-cell.has-meal::after {
        content: ''; position: absolute; bottom: 5px;
        width: 6px; height: 6px; background: var(--green-btn); border-radius: 50%;
      }
      .cal-num {
        font-size: 12px; font-weight: 500; color: var(--text);
        line-height: 24px; text-align: center; min-width: 24px;
      }

      /* ── DETAIL CARD ── */
      .meal-detail-card {
        background: var(--navy-card); color: #fff;
        border-radius: 14px; padding: 18px 20px;
      }
      .mdc-header {
        display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
      }
      .mdc-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
      .mdc-close { background: none; border: none; color: rgba(255,255,255,.5); font-size: 18px; cursor: pointer; transition: color .2s; }
      .mdc-close:hover { color: #fff; }

      .meal-entry {
        background: rgba(255,255,255,.07); border-radius: 10px;
        padding: 12px 14px; margin-bottom: 10px; position: relative;
      }
      .meal-entry:last-child { margin-bottom: 0; }
      .meal-entry-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .meal-type-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
      .dot-Breakfast { background: #f5a623; }
      .dot-Lunch     { background: #4caf50; }
      .dot-Dinner    { background: #e53935; }
      .dot-Snack     { background: #9ab5cc; }
      .meal-entry-name  { font-size: 14px; font-weight: 700; }
      .meal-entry-ingr  { font-size: 12px; color: #9ab5cc; line-height: 1.5; }
      .meal-entry-ingr span  { color: #cdd9e5; font-weight: 500; }
      .meal-entry-notes { font-size: 12px; color: #9ab5cc; margin-top: 4px; line-height: 1.4; }
      .meal-entry-notes span { color: #cdd9e5; font-weight: 500; }
      .meal-entry-actions { display: flex; gap: 6px; margin-top: 10px; }
      .me-btn {
        flex: 1; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
        color: #fff; border-radius: 6px; padding: 5px; font-family: 'DM Sans',sans-serif;
        font-size: 11px; font-weight: 600; cursor: pointer; transition: .2s;
      }
      .me-btn:hover { background: rgba(255,255,255,.18); }
      .me-btn.del { background: rgba(229,57,53,.15); border-color: rgba(229,57,53,.3); color: #ff8a80; }
      .me-btn.del:hover { background: rgba(229,57,53,.3); }

      .mdc-empty { text-align: center; color: #7a9ab5; font-size: 13px; padding: 24px 0; }
      .mdc-add-day-btn {
        width: 100%; background: rgba(255,255,255,.08); border: 1.5px dashed rgba(255,255,255,.2);
        color: #9ab5cc; border-radius: 8px; padding: 10px; font-family: 'DM Sans',sans-serif;
        font-size: 13px; cursor: pointer; margin-top: 14px; transition: .2s;
      }
      .mdc-add-day-btn:hover { border-color: rgba(255,255,255,.5); color: #fff; }

      /* ── PLAN MODAL ── */
      .plan-modal {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,.45); z-index: 200;
        align-items: center; justify-content: center;
      }
      .plan-modal.open { display: flex; animation: fadeUp .2s; }
      .plan-modal-box {
        background: #fff; border-radius: 14px; padding: 26px 28px 24px;
        width: 420px; max-width: 95vw; box-shadow: 0 24px 64px rgba(0,0,0,.22);
      }
      .plan-modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
      .plan-modal-title  { font-size: 17px; font-weight: 700; color: var(--text); }
      .plan-modal-sub    { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
      .plan-close-btn    { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }
      .plan-close-btn:hover { color: var(--text); }
      .plan-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .plan-group { margin-bottom: 13px; }
      .plan-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 5px; }
      .plan-group input,
      .plan-group select,
      .plan-group textarea {
        width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
        padding: 9px 12px; font-size: 13px; font-family: 'DM Sans',sans-serif;
        outline: none; color: var(--text); background: #fff; resize: none;
      }
      .plan-group input:focus,
      .plan-group select:focus,
      .plan-group textarea:focus { border-color: var(--navy); }
      .plan-group textarea { height: 72px; }
      .btn-add-meal {
        width: 100%; background: var(--green-btn); color: #fff; border: none;
        border-radius: 8px; padding: 12px; font-family: 'DM Sans',sans-serif;
        font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; transition: .2s;
      }
      .btn-add-meal:hover { background: #43a047; }

      .mp-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
      .mp-title     { font-size: 24px; font-weight: 700; }

      /* Delete confirm */
      .del-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,.45); z-index: 300;
        align-items: center; justify-content: center;
      }
      .del-overlay.open { display: flex; }
      .del-box {
        background: #fff; border-radius: 14px; padding: 28px 24px;
        width: 320px; max-width: 95vw; text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,.2);
      }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>
    <div class="main-wrap">
      <div id="topbar-root"></div>
      <div class="page-content">

        <div class="mp-title-row">
          <div class="mp-title">Meal Planning</div>
          <button class="btn-green" onclick="openPlanModal(null)">＋ add meal</button>
        </div>
        <div class="page-sub">Plan and track your weekly meals</div>

        <div class="meal-layout">
          <!-- Calendar -->
          <div>
            <div class="cal-card">
              <div class="cal-header">
                <div class="cal-month" id="cal-month-label">–</div>
                <div class="cal-nav">
                  <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
                  <span class="cal-nav-year" id="cal-year-label">–</span>
                  <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
                </div>
              </div>
              <div class="cal-grid" id="cal-grid"></div>
            </div>
          </div>

          <!-- Detail card -->
          <div>
            <div class="meal-detail-card">
              <div class="mdc-header">
                <div class="mdc-title">📅 <span id="mdc-day-title">Select a Day</span></div>
                <button class="mdc-close" onclick="clearSelection()">✕</button>
              </div>
              <div id="mdc-body">
                <div class="mdc-empty">Click any day on the calendar<br>to see planned meals</div>
              </div>
              <button class="mdc-add-day-btn" id="mdc-add-btn" style="display:none" onclick="openPlanModal(selectedDate)">
                ＋ Add meal for this day
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PLAN / EDIT MODAL -->
    <div class="plan-modal" id="plan-modal">
      <div class="plan-modal-box">
        <div class="plan-modal-header">
          <div>
            <div class="plan-modal-title" id="plan-modal-title">Plan a Meal</div>
            <div class="plan-modal-sub">Add a new meal to your weekly plan</div>
          </div>
          <button class="plan-close-btn" onclick="closePlanModal()">✕</button>
        </div>
        <input type="hidden" id="pm-edit-id"/>
        <div class="plan-row">
          <div class="plan-group">
            <label>Date *</label>
            <input type="date" id="pm-date"/>
          </div>
          <div class="plan-group">
            <label>Meal Type *</label>
            <select id="pm-type">
              <option value="">Select type</option>
              <option>Breakfast</option>
              <option>Lunch</option>
              <option>Dinner</option>
              <option>Snack</option>
            </select>
          </div>
        </div>
        <div class="plan-group">
          <label>Meal Name *</label>
          <input type="text" id="pm-name" placeholder="e.g. Chicken Stir-fry"/>
        </div>
        <div class="plan-group">
          <label>Ingredients</label>
          <textarea id="pm-ingr" placeholder="List the ingredients you'll use..."></textarea>
        </div>
        <div class="plan-group">
          <label>Notes (Optional)</label>
          <textarea id="pm-notes" placeholder="Any additional notes..." style="height:56px"></textarea>
        </div>
        <button class="btn-add-meal" id="plan-save-btn" onclick="saveMeal()">Add Meal</button>
      </div>
    </div>

    <!-- DELETE CONFIRM -->
    <div class="del-overlay" id="del-overlay">
      <div class="del-box">
        <div style="font-size:36px;margin-bottom:10px">🗑️</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">Remove Meal?</div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px">Remove <strong id="del-meal-name"></strong> from your plan?</div>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn-cancel" onclick="closeDelOverlay()">Cancel</button>
          <button style="background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer" onclick="confirmDeleteMeal()">Remove</button>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script>
      SavePlate.guardAuth();
      document.getElementById('sidebar-root').innerHTML = SavePlate.renderSidebar('meals');
      document.getElementById('topbar-root').innerHTML  = SavePlate.renderTopbar('Meal Planning');

      // ── STATE ──
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const today = new Date();
      let viewYear   = today.getFullYear();
      let viewMonth  = today.getMonth();     // 0-indexed
      let selectedDate = toDateStr(today);   // YYYY-MM-DD string
      let pendingDelId = null;

      // ── DATE HELPERS ──
      function toDateStr(d) {
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
      function todayStr() { return toDateStr(today); }

      // ── CALENDAR ──
      function renderCalendar() {
        document.getElementById('cal-month-label').textContent = monthNames[viewMonth];
        document.getElementById('cal-year-label').textContent  = viewYear;

        const dayHeaders = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        let html = dayHeaders.map(d => `<div class="cal-day-name">${d}</div>`).join('');

        const firstWeekDay = new Date(viewYear, viewMonth, 1).getDay();   // 0=Sun
        const daysInMonth  = new Date(viewYear, viewMonth+1, 0).getDate();
        const daysInPrev   = new Date(viewYear, viewMonth, 0).getDate();

        // Prev-month padding
        for (let i = firstWeekDay - 1; i >= 0; i--) {
          const d   = daysInPrev - i;
          const pm  = viewMonth - 1 < 0 ? 11 : viewMonth - 1;
          const py  = viewMonth - 1 < 0 ? viewYear - 1 : viewYear;
          const ds  = `${py}-${String(pm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          html += cellHTML(ds, d, true);
        }

        // Current month
        for (let d = 1; d <= daysInMonth; d++) {
          const ds = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          html += cellHTML(ds, d, false);
        }

        // Next-month padding
        const total = firstWeekDay + daysInMonth;
        for (let d = 1; d <= 42 - total; d++) {
          const nm = viewMonth + 1 > 11 ? 0  : viewMonth + 1;
          const ny = viewMonth + 1 > 11 ? viewYear + 1 : viewYear;
          const ds = `${ny}-${String(nm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          html += cellHTML(ds, d, true);
        }

        document.getElementById('cal-grid').innerHTML = html;
        renderDetailCard();
      }

      function cellHTML(dateStr, dayNum, otherMonth) {
        const isToday    = dateStr === todayStr();
        const isSelected = dateStr === selectedDate;
        const hasMeal    = SavePlate.getMealsForDate(dateStr).length > 0;
        const cls = [
          'cal-cell',
          otherMonth  ? 'other-month' : '',
          isToday     ? 'today'       : '',
          isSelected  ? 'selected'    : '',
          hasMeal     ? 'has-meal'    : '',
        ].filter(Boolean).join(' ');
        return `<div class="${cls}" onclick="selectDate('${dateStr}')">
          <span class="cal-num">${dayNum}</span>
        </div>`;
      }

      function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth > 11) { viewMonth = 0;  viewYear++; }
        if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
        renderCalendar();
      }

      function selectDate(dateStr) {
        selectedDate = dateStr;
        renderCalendar();
      }

      function clearSelection() {
        selectedDate = null;
        document.getElementById('mdc-day-title').textContent = 'Select a Day';
        document.getElementById('mdc-body').innerHTML = '<div class="mdc-empty">Click any day on the calendar<br>to see planned meals</div>';
        document.getElementById('mdc-add-btn').style.display = 'none';
        renderCalendar();
      }

      // ── DETAIL CARD ──
      function renderDetailCard() {
        if (!selectedDate) return;

        // Parse date carefully to avoid timezone shift
        const parts = selectedDate.split('-');
        const d     = new Date(+parts[0], +parts[1]-1, +parts[2]);
        const label = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
        document.getElementById('mdc-day-title').textContent = label;
        document.getElementById('mdc-add-btn').style.display = 'block';

        const meals = SavePlate.getMealsForDate(selectedDate)
          .sort((a,b) => { const o={Breakfast:0,Lunch:1,Dinner:2,Snack:3}; return (o[a.type]??4)-(o[b.type]??4); });

        if (!meals.length) {
          document.getElementById('mdc-body').innerHTML = '<div class="mdc-empty">No meals planned.<br><span style="font-size:12px;color:#7a9ab5">Use the button below to add one.</span></div>';
          return;
        }

        document.getElementById('mdc-body').innerHTML = meals.map(m => `
          <div class="meal-entry">
            <div class="meal-entry-top">
              <span class="meal-type-dot dot-${m.type}"></span>
              <span class="meal-entry-name">${m.name}</span>
            </div>
            ${m.ingredients ? `<div class="meal-entry-ingr"><span>Ingredients:</span> ${m.ingredients}</div>` : ''}
            ${m.notes       ? `<div class="meal-entry-notes"><span>Notes:</span> ${m.notes}</div>` : ''}
            <div class="meal-entry-actions">
              <button class="me-btn" onclick="openEditMeal('${m.id}')">✏️ Edit</button>
              <button class="me-btn del" onclick="openDelOverlay('${m.id}')">🗑️ Remove</button>
            </div>
          </div>`).join('');
      }

      // ── PLAN MODAL (add or edit) ──
      function openPlanModal(dateStr) {
        document.getElementById('plan-modal-title').textContent = 'Plan a Meal';
        document.getElementById('plan-save-btn').textContent    = 'Add Meal';
        document.getElementById('pm-edit-id').value = '';
        document.getElementById('pm-date').value    = dateStr || selectedDate || todayStr();
        document.getElementById('pm-type').value    = '';
        document.getElementById('pm-name').value    = '';
        document.getElementById('pm-ingr').value    = '';
        document.getElementById('pm-notes').value   = '';
        document.getElementById('plan-modal').classList.add('open');
      }

      function openEditMeal(id) {
        const m = SavePlate.meals.find(x => x.id === id);
        if (!m) return;
        document.getElementById('plan-modal-title').textContent = 'Edit Meal';
        document.getElementById('plan-save-btn').textContent    = 'Save Changes';
        document.getElementById('pm-edit-id').value = id;
        document.getElementById('pm-date').value    = m.date;
        document.getElementById('pm-type').value    = m.type;
        document.getElementById('pm-name').value    = m.name;
        document.getElementById('pm-ingr').value    = m.ingredients || '';
        document.getElementById('pm-notes').value   = m.notes || '';
        document.getElementById('plan-modal').classList.add('open');
      }

      function closePlanModal() { document.getElementById('plan-modal').classList.remove('open'); }

      function saveMeal() {
        const date   = document.getElementById('pm-date').value;
        const type   = document.getElementById('pm-type').value;
        const name   = document.getElementById('pm-name').value.trim();
        const ingr   = document.getElementById('pm-ingr').value.trim();
        const notes  = document.getElementById('pm-notes').value.trim();
        const editId = document.getElementById('pm-edit-id').value;

        if (!date || !type || !name) {
          SavePlate.toast('Please fill in Date, Meal Type, and Meal Name.', 'error');
          return;
        }

        if (editId) {
          SavePlate.updateMeal(editId, { date, type, name, ingredients: ingr, notes });
          SavePlate.toast(`"${name}" updated!`);
        } else {
          SavePlate.addMeal({ date, type, name, ingredients: ingr, notes });
          SavePlate.toast(`"${name}" added to your plan!`);
        }

        selectedDate = date;
        closePlanModal();
        renderCalendar();
        document.getElementById('topbar-root').innerHTML = SavePlate.renderTopbar('Meal Planning');
      }

      // ── DELETE ──
      function openDelOverlay(id) {
        const m = SavePlate.meals.find(x => x.id === id);
        if (!m) return;
        pendingDelId = id;
        document.getElementById('del-meal-name').textContent = m.name;
        document.getElementById('del-overlay').classList.add('open');
      }
      function closeDelOverlay() { document.getElementById('del-overlay').classList.remove('open'); pendingDelId = null; }
      function confirmDeleteMeal() {
        if (!pendingDelId) return;
        SavePlate.deleteMeal(pendingDelId);
        SavePlate.toast('Meal removed.', 'info');
        closeDelOverlay();
        renderCalendar();
        document.getElementById('topbar-root').innerHTML = SavePlate.renderTopbar('Meal Planning');
      }

      // Close modals on backdrop click
      document.getElementById('plan-modal').addEventListener('click', e => { if (e.target === document.getElementById('plan-modal')) closePlanModal(); });
      document.getElementById('del-overlay').addEventListener('click', e => { if (e.target === document.getElementById('del-overlay')) closeDelOverlay(); });

      // ── INIT ──
      renderCalendar();
    </script>
  </body>
</html>
