<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SavePlate - Inventory</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="sidebar-root"></div>
    <div class="main-wrap">
      <div id="topbar-root"></div>
      <div class="page-content">
        <div class="page-header">
          <div>
            <div class="page-title">Food Inventory</div>
            <div class="page-sub">
              Manage your food items and track expiry dates
            </div>
          </div>
          <button class="btn-green" onclick="openModal()">＋ add item</button>
        </div>

        <div class="search-row">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              placeholder="Search items..."
              oninput="filterInv(this.value)"
              id="search-input"
            />
          </div>
          <select class="cat-select" onchange="filterCat(this.value)">
            <option value="">All Categories</option>
            <option>Dairy</option>
            <option>Fruits</option>
            <option>Meat</option>
            <option>Vegetables</option>
            <option>Grains</option>
            <option>Canned</option>
            <option>Frozen</option>
            <option>Bakery</option>
          </select>
          <select
            class="cat-select"
            id="status-filter"
            onchange="filterStatus(this.value)"
          >
            <option value="">All Status</option>
            <option value="danger">Expiring Soon</option>
            <option value="warn">Watch</option>
            <option value="ok">Fresh</option>
          </select>
        </div>

        <div class="inv-grid" id="inv-grid"></div>
      </div>
    </div>

    <!-- ADD MODAL -->
    <div class="modal-overlay" id="modal">
      <div class="modal-box">
        <div class="modal-title">Add Food Item</div>
        <div class="form-group">
          <label>Item Name *</label>
          <input type="text" id="f-name" placeholder="e.g. Fresh Milk" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Quantity *</label>
            <input type="text" id="f-qty" placeholder="e.g. 1 Liter" />
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="f-cat">
              <option>Dairy</option>
              <option>Fruits</option>
              <option>Meat</option>
              <option>Vegetables</option>
              <option>Grains</option>
              <option>Canned</option>
              <option>Frozen</option>
              <option>Bakery</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Expiry Date *</label>
            <input type="date" id="f-exp" />
          </div>
          <div class="form-group">
            <label>Storage Location</label>
            <select id="f-loc">
              <option>Fridge</option>
              <option>Pantry</option>
              <option>Freezer</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Notes (optional)</label>
          <input type="text" id="f-notes" placeholder="Any remarks..." />
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button
            class="btn-navy"
            style="width: auto; padding: 10px 22px"
            onclick="addItem()"
          >
            Add Item
          </button>
        </div>
      </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="edit-modal">
      <div class="modal-box">
        <div class="modal-title">Edit Food Item</div>
        <div class="form-group">
          <label>Item Name *</label>
          <input type="text" id="e-name" placeholder="e.g. Fresh Milk" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Quantity *</label>
            <input type="text" id="e-qty" placeholder="e.g. 1 Liter" />
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="e-cat">
              <option>Dairy</option>
              <option>Fruits</option>
              <option>Meat</option>
              <option>Vegetables</option>
              <option>Grains</option>
              <option>Canned</option>
              <option>Frozen</option>
              <option>Bakery</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Expiry Date *</label>
            <input type="date" id="e-exp" />
          </div>
          <div class="form-group">
            <label>Storage Location</label>
            <select id="e-loc">
              <option>Fridge</option>
              <option>Pantry</option>
              <option>Freezer</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Notes (optional)</label>
          <input type="text" id="e-notes" placeholder="Any remarks..." />
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
          <button
            class="btn-navy"
            style="width: auto; padding: 10px 22px"
            onclick="saveEdit()"
          >
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <!-- CONVERT TO DONATION CONFIRM MODAL -->
    <div class="modal-overlay" id="donate-modal">
      <div class="modal-box" style="width: 360px">
        <div class="modal-title">🤝 List for Donation?</div>
        <p
          style="font-size: 14px; color: #555; margin-bottom: 20px"
          id="donate-msg"
        >
          This item will be listed for donation.
        </p>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeDonateModal()">
            Cancel
          </button>
          <button
            class="btn-navy"
            style="width: auto; padding: 10px 22px; background: var(--amber)"
            onclick="confirmDonate()"
          >
            Yes, List it!
          </button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script>
      SavePlate.ready.then(function () {
        SavePlate.guardAuth();
        SavePlate.updateInventoryStatus();
        document.getElementById("sidebar-root").innerHTML =
          SavePlate.renderSidebar("inventory");
        document.getElementById("topbar-root").innerHTML =
          SavePlate.renderTopbar("Inventory");

        let searchQ = "",
          catFilter = "",
          statusFilter = "";
        let pendingDonateId = null;
        let editingId = null;

        function getView() {
          return SavePlate.inventory.filter((i) => {
            const matchQ =
              !searchQ || i.name.toLowerCase().includes(searchQ.toLowerCase());
            const matchCat = !catFilter || i.cat === catFilter;
            const matchSt = !statusFilter || i.status === statusFilter;
            return matchQ && matchCat && matchSt;
          });
        }

        function renderGrid() {
          const data = getView();
          if (data.length === 0) {
            document.getElementById("inv-grid").innerHTML =
              `<div style="grid-column:1/-1;text-align:center;color:#aaa;padding:40px;font-size:14px;">No items found.</div>`;
            return;
          }
          document.getElementById("inv-grid").innerHTML = data
            .map((item) => {
              const statusTag = item.usedUp
                ? `<span class="status-tag used">Used</span>`
                : item.donated
                  ? `<span class="status-tag donated">Donated</span>`
                  : "";
              return `<div class="inv-card ${item.usedUp ? "used-card" : ""} ${item.donated ? "donated-card" : ""}">
          <div class="inv-card-header">
            <div class="inv-icon">${SavePlate.catEmoji[item.cat] || "🍽"}</div>
            <div>
              <div class="inv-name">${item.name}${statusTag}</div>
              <div class="inv-cat">${item.cat}</div>
            </div>
          </div>
          <button class="inv-close" onclick="removeItem(${item.id})">✕</button>
          <div class="inv-row"><span class="inv-row-label">Quantity:</span><span>${item.qty}</span></div>
          <div class="inv-row"><span class="inv-row-label">Location:</span><span>${item.loc}</span></div>
          <div class="inv-row">
            <span class="inv-row-label">Expires:</span>
            <span class="exp-badge ${item.status}">⏰ ${SavePlate.daysLeft(item.exp)}</span>
          </div>
          <div class="inv-date">${new Date(item.exp).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })}</div>
          ${
            !item.usedUp && !item.donated
              ? `<div class="inv-actions">
            <button class="inv-action-btn btn-used"   onclick="markUsed(${item.id})">✅ Mark Used</button>
            <button class="inv-action-btn btn-donate" onclick="openDonateModal(${item.id},'${item.name.replace(/'/g, "\\'")}')">🤝 Donate</button>
            <button class="inv-action-btn btn-edit"   onclick="openEditModal(${item.id})">Edit</button>
          </div>`
              : ""
          }
        </div>`;
            })
            .join("");
        }

        window.filterInv = function (q) {
          searchQ = q;
          renderGrid();
        };
        window.filterCat = function (c) {
          catFilter = c;
          renderGrid();
        };
        window.filterStatus = function (s) {
          statusFilter = s;
          renderGrid();
        };

        window.removeItem = function (id) {
          if (!confirm("Remove this item?")) return;
          SavePlate.removeInventoryItem(id);
          renderGrid();
        };
        window.markUsed = function (id) {
          SavePlate.markItemUsed(id);
          renderGrid();
        };
        window.openDonateModal = function (id, name) {
          pendingDonateId = id;
          document.getElementById("donate-msg").textContent =
            `"${name}" will be listed as a donation for others to claim.`;
          document.getElementById("donate-modal").classList.add("open");
        };
        window.closeDonateModal = function () {
          document.getElementById("donate-modal").classList.remove("open");
        };
        window.confirmDonate = function () {
          SavePlate.convertToDonation(pendingDonateId);
          closeDonateModal();
          renderGrid();
        };

        window.openModal = function () {
          document.getElementById("modal").classList.add("open");
        };
        window.closeModal = function () {
          document.getElementById("modal").classList.remove("open");
        };
        window.addItem = function () {
          const name = document.getElementById("f-name").value.trim();
          const qty = document.getElementById("f-qty").value.trim();
          const cat = document.getElementById("f-cat").value;
          const exp = document.getElementById("f-exp").value;
          const loc = document.getElementById("f-loc").value;
          if (!name || !qty || !exp) {
            alert("Please fill required fields (*).");
            return;
          }
          if (new Date(exp) < new Date()) {
            alert("Expiry date cannot be in the past.");
            return;
          }
          SavePlate.addInventoryItem({
            name,
            emoji: SavePlate.catEmoji[cat] || "🍽",
            cat,
            qty,
            loc,
            exp,
          });
          renderGrid();
          closeModal();
          ["f-name", "f-qty", "f-exp", "f-notes"].forEach(
            (id) => (document.getElementById(id).value = ""),
          );
        };

        // ── Edit ──────────────────────────────────────────────────────
        window.openEditModal = function (id) {
          const inv = SavePlate.inventory;
          const item = inv.find((i) => i.id === id);
          if (!item) return;
          editingId = id;
          document.getElementById("e-name").value = item.name;
          document.getElementById("e-qty").value = item.qty;
          document.getElementById("e-cat").value = item.cat;
          document.getElementById("e-exp").value = item.exp;
          document.getElementById("e-loc").value = item.loc;
          document.getElementById("e-notes").value = item.notes || "";
          document.getElementById("edit-modal").classList.add("open");
        };

        window.closeEditModal = function () {
          document.getElementById("edit-modal").classList.remove("open");
          editingId = null;
        };

        window.saveEdit = async function () {
          const name = document.getElementById("e-name").value.trim();
          const qty = document.getElementById("e-qty").value.trim();
          const cat = document.getElementById("e-cat").value;
          const exp = document.getElementById("e-exp").value;
          const loc = document.getElementById("e-loc").value;
          const notes = document.getElementById("e-notes").value.trim();

          if (!name || !qty || !exp) {
            alert("Please fill required fields (*).");
            return;
          }
          if (new Date(exp) < new Date()) {
            alert("Expiry date cannot be in the past.");
            return;
          }

          try {
            // Calculate status based on new expiry
            const diff = (new Date(exp) - new Date()) / 86400000;
            const status = diff <= 2 ? "danger" : diff <= 5 ? "warn" : "ok";

            // Prepare updates
            const updates = {
              name: name,
              qty: qty,
              cat: cat,
              exp: exp,
              loc: loc,
              notes: notes,
              emoji: SavePlate.catEmoji[cat] || "🍽",
              status: status,
            };

            // Call the update method
            const success = SavePlate.updateInventoryItem(editingId, updates);

            if (success) {
              window.closeEditModal();
              renderGrid();
            } else {
              alert("Failed to update item. Please try again.");
            }
          } catch (error) {
            console.error("Error saving edit:", error);
            alert("An error occurred while saving. Please try again.");
          }
        };

        // Close modals on backdrop click
        document.getElementById("modal").addEventListener("click", (e) => {
          if (e.target.id === "modal") closeModal();
        });
        document.getElementById("edit-modal").addEventListener("click", (e) => {
          if (e.target.id === "edit-modal") closeEditModal();
        });
        document
          .getElementById("donate-modal")
          .addEventListener("click", (e) => {
            if (e.target.id === "donate-modal") closeDonateModal();
          });

        renderGrid();
      }); // end SavePlate.ready.then
    </script>
  </body>
</html>
