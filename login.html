<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SavePlate – Log In</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .field-error { color: var(--red); font-size: 11px; margin-top: -8px; margin-bottom: 8px; display: none; text-align: left; }
      .auth-input.invalid { border-color: var(--red); }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <span class="auth-logo"><img src="images/Logo.png" alt="SavePlate Logo" /></span>
        <div class="auth-title">SavePlate</div>
        <div class="auth-sub">Smart food waste reduction</div>

        <label class="auth-field-label">Email</label>
        <input class="auth-input" type="email" id="email" placeholder="you@email.com" oninput="clearErr('email')"/>
        <div class="field-error" id="email-err">Please enter a valid email address (must contain @).</div>

        <label class="auth-field-label">Password</label>
        <input class="auth-input" type="password" id="pass" placeholder="••••••••" oninput="clearErr('pass')"/>
        <div class="field-error" id="pass-err">Password is required.</div>

        <a class="auth-link" href="signup.html">Don't have an account?</a>
        <button class="btn-navy" onclick="doLogin()">Log In</button>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script>
      function clearErr(field) {
        document.getElementById(field + '-err').style.display = 'none';
        document.getElementById(field).classList.remove('invalid');
      }

      function showErr(field, msg) {
        const el = document.getElementById(field + '-err');
        if (msg) el.textContent = msg;
        el.style.display = 'block';
        document.getElementById(field).classList.add('invalid');
      }

      function doLogin() {
        const e = document.getElementById('email').value.trim();
        const p = document.getElementById('pass').value.trim();
        let ok = true;

        if (!e) { showErr('email', 'Email is required.'); ok = false; }
        else if (!SavePlate.validEmail(e)) { showErr('email', 'Please enter a valid email address (must contain @).'); ok = false; }

        if (!p) { showErr('pass', 'Password is required.'); ok = false; }

        if (!ok) return;
        SavePlate.setUser({ name: e.split('@')[0], email: e });
        location.href = 'dashboard.html';
      }

      document.addEventListener('keydown', ev => { if (ev.key === 'Enter') doLogin(); });
    </script>
  </body>
</html>
