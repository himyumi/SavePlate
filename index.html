<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SavePlate</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="onboard-page">
      <div class="onboard-card">
        <div class="onboard-mascot">
          <img src="images/Logo.png" alt="SavePlate Logo" />
        </div>
        <div class="onboard-divider"></div>
        <div class="onboard-right">
          <h1>WELCOME TO<br />SAVEPLATE!</h1>
          <button
            class="btn-navy"
            style="width: auto; padding: 10px 26px"
            onclick="location.href = 'login.html'"
          >
            Continue
          </button>
        </div>
      </div>
    </div>
    <script src="js/data.js"></script>
    <script>
      // If already logged in, go straight to dashboard
      if (SavePlate.user) location.href = "dashboard.html";
    </script>
  </body>
</html>
