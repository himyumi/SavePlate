<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SavePlate – Analytics</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .analytics-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 22px;
      }
      .an-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 24px;
      }
      .an-card-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .an-card-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 20px;
      }
      .bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 160px;
      }
      .bar-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        flex: 1;
      }
      .bar-wrap {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 130px;
      }
      .bar {
        border-radius: 4px 4px 0 0;
        min-width: 16px;
        transition: height 0.4s ease;
        cursor: pointer;
        position: relative;
      }
      .bar:hover::after {
        content: attr(data-tip);
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: #fff;
        font-size: 10px;
        padding: 3px 7px;
        border-radius: 4px;
        white-space: nowrap;
        pointer-events: none;
      }
      .bar-saved {
        background: var(--green);
      }
      .bar-wasted {
        background: var(--red);
      }
      .bar-donated {
        background: var(--amber);
      }
      .bar-label {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 600;
      }
      .legend {
        display: flex;
        gap: 14px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-muted);
      }
      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }
      .progress-section {
        margin-bottom: 16px;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .progress-bar {
        height: 10px;
        background: #eee;
        border-radius: 5px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 5px;
        transition: width 0.6s ease;
      }
      .impact-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }
      .impact-tile {
        background: var(--navy-card);
        color: #fff;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
      }
      .impact-num {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .impact-label {
        font-size: 12px;
        color: #9ab5cc;
      }
      .cat-chart {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cat-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cat-name {
        width: 100px;
        font-size: 13px;
        font-weight: 500;
        flex-shrink: 0;
      }
      .cat-bar-wrap {
        flex: 1;
        height: 16px;
        background: #eee;
        border-radius: 8px;
        overflow: hidden;
      }
      .cat-bar-fill {
        height: 100%;
        border-radius: 8px;
        background: var(--navy);
        transition: width 0.5s;
      }
      .cat-count {
        font-size: 12px;
        color: var(--text-muted);
        width: 24px;
        text-align: right;
        flex-shrink: 0;
      }
      .empty-analytics {
        text-align: center;
        color: #aaa;
        padding: 40px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>
    <div class="main-wrap">
      <div id="topbar-root"></div>
      <div class="page-content">
        <div style="margin-bottom: 22px">
          <div class="page-title">📊 Food Analytics</div>
          <div class="page-sub">Track your food-saving impact and progress</div>
        </div>

        <!-- Impact Tiles -->
        <div class="impact-grid" id="impact-grid"></div>

        <!-- Bar Chart + Category Breakdown -->
        <div class="analytics-grid">
          <div class="an-card">
            <div class="an-card-title">Monthly Overview</div>
            <div class="an-card-sub">
              Food saved vs. wasted vs. donated (kg)
            </div>
            <div class="legend">
              <div class="legend-item">
                <div class="legend-dot" style="background: var(--green)"></div>
                Saved
              </div>
              <div class="legend-item">
                <div class="legend-dot" style="background: var(--red)"></div>
                Wasted
              </div>
              <div class="legend-item">
                <div class="legend-dot" style="background: var(--amber)"></div>
                Donated
              </div>
            </div>
            <div class="bar-chart" id="bar-chart"></div>
          </div>

          <div class="an-card">
            <div class="an-card-title">Category Breakdown</div>
            <div class="an-card-sub">
              Items by food category in your inventory
            </div>
            <div class="cat-chart" id="cat-chart"></div>
          </div>
        </div>

        <!-- Progress bars -->
        <div class="an-card" style="margin-bottom: 22px">
          <div class="an-card-title">🎯 Goals & Progress</div>
          <div class="an-card-sub">
            Your food-saving achievements this month
          </div>
          <div id="progress-section"></div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script>
      SavePlate.ready.then(function () {
      SavePlate.guardAuth();
      document.getElementById("sidebar-root").innerHTML =
        SavePlate.renderSidebar("analytics");
      document.getElementById("topbar-root").innerHTML =
        SavePlate.renderTopbar("Analytics");

      const analytics = SavePlate.analytics;
      const inv = SavePlate.inventory.filter((i) => !i.usedUp && !i.donated);

      // Impact tiles
      const totalSaved = analytics.reduce((a, b) => a + (b.saved || 0), 0);
      const totalWasted = analytics.reduce((a, b) => a + (b.wasted || 0), 0);
      const totalDonated = analytics.reduce((a, b) => a + (b.donated || 0), 0);
      const donCount = SavePlate.donations.length;

      document.getElementById("impact-grid").innerHTML = [
        {
          num: totalSaved.toFixed(1) + "kg",
          label: "Total Food Saved",
          color: "var(--green)",
        },
        {
          num: totalDonated.toFixed(1) + "kg",
          label: "Total Donated",
          color: "var(--amber)",
        },
        {
          num: totalWasted.toFixed(1) + "kg",
          label: "Estimated Wasted",
          color: "var(--red)",
        },
        { num: donCount, label: "Donations Listed", color: "var(--navy)" },
        { num: inv.length, label: "Items in Inventory", color: "#5c7cfa" },
        {
          num: inv.filter((i) => i.status === "danger" || i.status === "warn")
            .length,
          label: "Expiring Soon",
          color: "var(--red)",
        },
      ]
        .map(
          (t) => `<div class="impact-tile">
      <div class="impact-num" style="color:${t.color}">${t.num}</div>
      <div class="impact-label">${t.label}</div>
    </div>`,
        )
        .join("");

      // Bar chart
      if (analytics.length === 0) {
        document.getElementById("bar-chart").innerHTML =
          `<div class="empty-analytics">No data yet. Start logging food items!</div>`;
      } else {
        const maxVal = Math.max(
          ...analytics.flatMap((r) => [
            r.saved || 0,
            r.wasted || 0,
            r.donated || 0,
          ]),
        );
        const barH = 120;
        document.getElementById("bar-chart").innerHTML = analytics
          .map((r) => {
            const hS =
              maxVal > 0 ? Math.round(((r.saved || 0) / maxVal) * barH) : 0;
            const hW =
              maxVal > 0 ? Math.round(((r.wasted || 0) / maxVal) * barH) : 0;
            const hD =
              maxVal > 0 ? Math.round(((r.donated || 0) / maxVal) * barH) : 0;
            return `<div class="bar-group">
          <div class="bar-wrap">
            <div class="bar bar-saved"   style="height:${hS}px" data-tip="Saved: ${r.saved}kg"></div>
            <div class="bar bar-wasted"  style="height:${hW}px" data-tip="Wasted: ${r.wasted}kg"></div>
            <div class="bar bar-donated" style="height:${hD}px" data-tip="Donated: ${r.donated || 0}kg"></div>
          </div>
          <div class="bar-label">${r.m}</div>
        </div>`;
          })
          .join("");
      }

      // Category breakdown
      const catCounts = {};
      SavePlate.inventory.forEach((i) => {
        catCounts[i.cat] = (catCounts[i.cat] || 0) + 1;
      });
      const catMax = Math.max(1, ...Object.values(catCounts));
      const catEmoji = SavePlate.catEmoji;
      document.getElementById("cat-chart").innerHTML =
        Object.entries(catCounts)
          .sort((a, b) => b[1] - a[1])
          .map(
            ([cat, cnt]) => `<div class="cat-row">
        <div class="cat-name">${catEmoji[cat] || "🍽"} ${cat}</div>
        <div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:${Math.round((cnt / catMax) * 100)}%"></div></div>
        <div class="cat-count">${cnt}</div>
      </div>`,
          )
          .join("") ||
        `<div class="empty-analytics">No inventory items yet.</div>`;

      // Progress section
      const curMonthData = analytics[analytics.length - 1] || {
        saved: 0,
        wasted: 0,
        donated: 0,
      };
      const savedGoal = 10,
        donateGoal = 5;
      document.getElementById("progress-section").innerHTML = `
      <div class="progress-section">
        <div class="progress-label"><span>🌿 Food Saved This Month</span><span style="color:var(--green)">${curMonthData.saved}kg / ${savedGoal}kg</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, (curMonthData.saved / savedGoal) * 100)}%;background:var(--green)"></div></div>
      </div>
      <div class="progress-section">
        <div class="progress-label"><span>🤝 Donations This Month</span><span style="color:var(--amber)">${curMonthData.donated || 0}kg / ${donateGoal}kg</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, ((curMonthData.donated || 0) / donateGoal) * 100)}%;background:var(--amber)"></div></div>
      </div>
      <div class="progress-section">
        <div class="progress-label"><span>♻️ Waste Reduction</span><span style="color:var(--navy)">${Math.max(0, savedGoal - (curMonthData.wasted || 0)).toFixed(1)}kg reduction</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, Math.max(0, 100 - ((curMonthData.wasted || 0) / savedGoal) * 100))}%;background:var(--navy)"></div></div>
      </div>`;
      }); // end SavePlate.ready.then
    </script>
  </body>
</html>
