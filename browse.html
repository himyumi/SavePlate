<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SavePlate – Browse Donations</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="sidebar-root"></div>
    <div class="main-wrap">
      <div id="topbar-root"></div>
      <div class="page-content">
        <div class="page-header">
          <div>
            <div class="page-title">Browse Donations</div>
            <div class="page-sub">
              Claim available food from community members near you
            </div>
          </div>
          <div style="font-size: 13px; color: #888" id="donation-count">
            Loading...
          </div>
        </div>
        <div class="search-row">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              placeholder="Search listings..."
              oninput="filter(this.value)"
            />
          </div>
          <select
            class="cat-select"
            id="loc-filter"
            onchange="filterLoc(this.value)"
          >
            <option value="">All Locations</option>
            <option>Kuala Lumpur</option>
            <option>Denpasar</option>
            <option>Jakarta</option>
            <option>Surabaya</option>
            <option>Singapore</option>
            <option>malacca</option>
          </select>
          <select
            class="cat-select"
            id="avail-filter"
            onchange="filterAvail(this.value)"
          >
            <option value="">All Items</option>
            <option value="available">Available Only</option>
          </select>
        </div>
        <div class="donate-grid" id="grid"></div>
      </div>
    </div>

    <!-- Claim confirmation -->
    <div class="modal-overlay" id="claim-modal">
      <div class="modal-box" style="width: 380px">
        <div class="modal-title">Claim Donation?</div>
        <p
          style="font-size: 14px; color: #555; margin-bottom: 8px"
          id="claim-msg"
        >
          You are about to claim this item.
        </p>
        <div
          id="claim-contact-info"
          style="
            background: #f0f6ff;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
          "
        >
          <div style="font-weight: 700; color: #1a2e4a; margin-bottom: 8px">
            📋 Donor Contact Info
          </div>
          <div
            id="claim-donor-name"
            style="margin-bottom: 4px; color: #444"
          ></div>
          <div
            id="claim-donor-email"
            style="margin-bottom: 4px; color: #5a8fc2"
          ></div>
          <div id="claim-donor-loc" style="color: #888"></div>
          <div style="margin-top: 8px; font-size: 11px; color: #aaa">
            Use this info to arrange pickup after claiming.
          </div>
        </div>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 20px">
          The donor will be notified to arrange pickup with you.
        </p>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeClaimModal()">Cancel</button>
          <button
            class="btn-navy"
            style="width: auto; padding: 10px 22px"
            onclick="confirmClaim()"
          >
            Claim It!
          </button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script>
      SavePlate.ready.then(function () {
        SavePlate.guardAuth();
        document.getElementById("sidebar-root").innerHTML =
          SavePlate.renderSidebar("browse");
        document.getElementById("topbar-root").innerHTML =
          SavePlate.renderTopbar("Browse Donations");

        let searchQ = "",
          locFilter = "",
          availFilter = "";
        let pendingClaimId = null;

        // FIX: use uid for ownership check, not name
        const currentUid = SavePlate.user ? SavePlate.user.uid : null;

        function getView() {
          return SavePlate.donations.filter((d) => {
            const matchQ =
              !searchQ || d.name.toLowerCase().includes(searchQ.toLowerCase());
            const matchLoc = !locFilter || d.loc === locFilter;
            // Only show unclaimed items (claimed ones are removed from cache after claiming)
            const matchA =
              !availFilter ||
              (availFilter === "available" && !d.claimed) ||
              (availFilter === "claimed" && d.claimed);
            return matchQ && matchLoc && matchA;
          });
        }

        function render() {
          const data = getView();
          const total = SavePlate.donations.filter((d) => !d.claimed).length;
          document.getElementById("donation-count").textContent =
            `${total} item${total !== 1 ? "s" : ""} available`;

          if (data.length === 0) {
            document.getElementById("grid").innerHTML =
              `<div class="empty-state">No donations found matching your filters.</div>`;
            return;
          }

          document.getElementById("grid").innerHTML = data
            .map((d) => {
              const isOwn = currentUid && d.donorUid === currentUid;
              return `<div class="donate-card ${d.claimed ? "claimed-card" : ""}">
                ${d.claimed ? `<span class="claimed-ribbon">Claimed</span>` : ""}
                ${isOwn && !d.claimed ? `<span class="my-donation-tag">Your listing</span>` : ""}
                <span class="dc-emoji">${d.emoji}</span>
                <div class="dc-name">${d.name}</div>
                <div class="dc-row">📦 ${d.qty}</div>
                <div class="dc-row">📍 ${d.loc}</div>
                <div class="dc-row">⏰ Expires: ${d.exp}</div>
                <div class="dc-row">👤 From: ${d.donor}</div>
                ${d.donorEmail ? `<div class="dc-row" style="color:#5a8fc2;font-size:12px;">✉️ ${d.donorEmail}</div>` : ""}
                ${
                  !d.claimed && !isOwn
                    ? `<button class="dc-btn" onclick="openClaimModal(${d.id},'${d.name.replace(/'/g, "\\'")}')">Request / Claim</button>`
                    : d.claimed
                      ? `<button class="dc-btn claimed-btn" disabled>Already Claimed</button>`
                      : `<button class="dc-btn" disabled style="opacity:0.5;cursor:default;">Your Listing</button>`
                }
              </div>`;
            })
            .join("");
        }

        window.filter = function (q) {
          searchQ = q;
          render();
        };
        window.filterLoc = function (l) {
          locFilter = l;
          render();
        };
        window.filterAvail = function (a) {
          availFilter = a;
          render();
        };

        window.openClaimModal = function (id, name) {
          pendingClaimId = id;
          document.getElementById("claim-msg").textContent =
            `You are about to claim "${name}".`;
          // Populate donor contact info
          const donation = SavePlate.donations.find((d) => d.id === id);
          const contactEl = document.getElementById("claim-contact-info");
          if (donation && (donation.donorEmail || donation.donorLocation)) {
            document.getElementById("claim-donor-name").textContent =
              `👤 ${donation.donor || "Anonymous"}`;
            document.getElementById("claim-donor-email").textContent =
              donation.donorEmail ? `✉️ ${donation.donorEmail}` : "";
            document.getElementById("claim-donor-loc").textContent =
              donation.donorLocation
                ? `📍 ${donation.donorLocation}`
                : donation.loc
                  ? `📍 ${donation.loc}`
                  : "";
            contactEl.style.display = "block";
          } else {
            contactEl.style.display = "none";
          }
          document.getElementById("claim-modal").classList.add("open");
        };
        window.closeClaimModal = function () {
          document.getElementById("claim-modal").classList.remove("open");
        };
        window.confirmClaim = async function () {
          const btn = document.querySelector("#claim-modal .btn-navy");
          if (btn) {
            btn.textContent = "Claiming…";
            btn.disabled = true;
          }
          const ok = await SavePlate.claimDonation(pendingClaimId);
          closeClaimModal();
          if (btn) {
            btn.textContent = "Claim It!";
            btn.disabled = false;
          }
          if (ok) render();
        };

        document
          .getElementById("claim-modal")
          .addEventListener("click", (e) => {
            if (e.target.id === "claim-modal") closeClaimModal();
          });

        render();
      });
    </script>
  </body>
</html>
