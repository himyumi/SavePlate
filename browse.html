<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SavePlate – Browse Donations</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .donate-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 14px;
      }
      .donate-card {
        background: var(--navy-card);
        color: #fff;
        border-radius: 14px;
        padding: 18px;
        transition: transform 0.2s;
        position: relative;
      }
      .donate-card:hover {
        transform: translateY(-2px);
      }
      .donate-card.claimed-card {
        opacity: 0.5;
      }
      .dc-emoji {
        font-size: 38px;
        margin-bottom: 12px;
        display: block;
      }
      .dc-name {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .dc-row {
        font-size: 12px;
        color: #9ab5cc;
        margin-bottom: 4px;
      }
      .dc-btn {
        margin-top: 14px;
        width: 100%;
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        border-radius: 8px;
        padding: 8px;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
      }
      .dc-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .dc-btn.claimed-btn {
        background: rgba(76, 175, 80, 0.3);
        border-color: rgba(76, 175, 80, 0.5);
        cursor: default;
      }
      .claimed-ribbon {
        position: absolute;
        top: 12px;
        right: 12px;
        background: #66bb6a;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
      }
      .my-donation-tag {
        position: absolute;
        top: 12px;
        right: 12px;
        background: var(--amber);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 20px;
      }
      .empty-state {
        grid-column: 1/-1;
        text-align: center;
        color: #aaa;
        padding: 60px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="sidebar-root"></div>
    <div class="main-wrap">
      <div id="topbar-root"></div>
      <div class="page-content">
        <div class="page-header">
          <div>
            <div class="page-title">Browse Donations</div>
            <div class="page-sub">
              Claim available food from community members near you
            </div>
          </div>
          <div style="font-size: 13px; color: #888" id="donation-count">
            Loading...
          </div>
        </div>
        <div class="search-row">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              placeholder="Search listings..."
              oninput="filter(this.value)"
            />
          </div>
          <select
            class="cat-select"
            id="loc-filter"
            onchange="filterLoc(this.value)"
          >
            <option value="">📍 All Locations</option>
            <option>Kuala Lumpur</option>
            <option>Petaling Jaya</option>
            <option>Subang Jaya</option>
            <option>Cheras</option>
            <option>Kepong</option>
            <option>Ampang</option>
            <option>My Location</option>
          </select>
          <select
            class="cat-select"
            id="avail-filter"
            onchange="filterAvail(this.value)"
          >
            <option value="">All Items</option>
            <option value="available">Available Only</option>
            <option value="claimed">Claimed</option>
          </select>
        </div>
        <div class="donate-grid" id="grid"></div>
      </div>
    </div>

    <!-- Claim confirmation modal -->
    <div class="modal-overlay" id="claim-modal">
      <div class="modal-box" style="width: 360px">
        <div class="modal-title">🤝 Claim Donation?</div>
        <p
          style="font-size: 14px; color: #555; margin-bottom: 8px"
          id="claim-msg"
        >
          You are about to claim this item.
        </p>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 20px">
          The donor will be notified to arrange pickup.
        </p>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeClaimModal()">Cancel</button>
          <button
            class="btn-navy"
            style="width: auto; padding: 10px 22px"
            onclick="confirmClaim()"
          >
            Claim It!
          </button>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script>
      SavePlate.ready.then(function () {
      SavePlate.guardAuth();
      document.getElementById("sidebar-root").innerHTML =
        SavePlate.renderSidebar("browse");
      document.getElementById("topbar-root").innerHTML =
        SavePlate.renderTopbar("Browse Donations");

      let searchQ = "",
        locFilter = "",
        availFilter = "";
      let pendingClaimId = null;
      const currentUser = SavePlate.user.name;

      function getView() {
        return SavePlate.donations.filter((d) => {
          const matchQ =
            !searchQ || d.name.toLowerCase().includes(searchQ.toLowerCase());
          const matchLoc = !locFilter || d.loc === locFilter;
          const matchA =
            !availFilter ||
            (availFilter === "available" && !d.claimed) ||
            (availFilter === "claimed" && d.claimed);
          return matchQ && matchLoc && matchA;
        });
      }

      function render() {
        const data = getView();
        const total = SavePlate.donations.filter((d) => !d.claimed).length;
        document.getElementById("donation-count").textContent =
          `${total} item${total !== 1 ? "s" : ""} available`;
        if (data.length === 0) {
          document.getElementById("grid").innerHTML =
            `<div class="empty-state">😕 No donations found matching your filters.</div>`;
          return;
        }
        document.getElementById("grid").innerHTML = data
          .map((d) => {
            const isOwn = d.donor === currentUser || d.fromInventory;
            return `<div class="donate-card ${d.claimed ? "claimed-card" : ""}">
          ${d.claimed ? `<span class="claimed-ribbon">✅ Claimed</span>` : ""}
          ${isOwn && !d.claimed ? `<span class="my-donation-tag">Your listing</span>` : ""}
          <span class="dc-emoji">${d.emoji}</span>
          <div class="dc-name">${d.name}</div>
          <div class="dc-row">📦 ${d.qty}</div>
          <div class="dc-row">📍 ${d.loc}</div>
          <div class="dc-row">⏰ Expires: ${d.exp}</div>
          <div class="dc-row">👤 From: ${d.donor}</div>
          ${
            !d.claimed && !isOwn
              ? `<button class="dc-btn" onclick="openClaimModal(${d.id},'${d.name}')">Request / Claim</button>`
              : d.claimed
                ? `<button class="dc-btn claimed-btn" disabled>Already Claimed</button>`
                : `<button class="dc-btn" disabled style="opacity:0.5;cursor:default;">Your Listing</button>`
          }
        </div>`;
          })
          .join("");
      }

      function filter(q) {
        searchQ = q;
        render();
      }
      function filterLoc(l) {
        locFilter = l;
        render();
      }
      function filterAvail(a) {
        availFilter = a;
        render();
      }

      function openClaimModal(id, name) {
        pendingClaimId = id;
        document.getElementById("claim-msg").textContent =
          `You are about to claim "${name}".`;
        document.getElementById("claim-modal").classList.add("open");
      }
      function closeClaimModal() {
        document.getElementById("claim-modal").classList.remove("open");
      }
      function confirmClaim() {
        const ok = SavePlate.claimDonation(pendingClaimId);
        closeClaimModal();
        if (ok) render();
      }

      document.getElementById("claim-modal").addEventListener("click", (e) => {
        if (e.target.id === "claim-modal") closeClaimModal();
      });
      render();
      }); // end SavePlate.ready.then
    </script>
  </body>
</html>
